<!doctype html>
<html lang="ar"><head><meta charset="utf-8"><title>EFH reel cover</title>
<link rel="stylesheet" href="../fonts/fonts.css"><link rel="stylesheet" href="style.css">
<style>
  #c { position:absolute; inset:0; overflow:hidden; background: radial-gradient(ellipse at 50% 42%, #1a5fd6 0%, #0b1f4d 48%, #030a1f 100%); }
  .rays { position:absolute; left:-460px; top:-120px; width:2000px; height:2000px;
    background: repeating-conic-gradient(from 0deg at 50% 50%, rgba(255,181,71,.18) 0deg 6deg, rgba(255,181,71,0) 6deg 18deg);
    -webkit-mask-image: radial-gradient(circle, #000 0%, rgba(0,0,0,.55) 30%, transparent 62%); }
  .glow { position:absolute; left:90px; top:620px; width:900px; height:900px; border-radius:50%;
    background: radial-gradient(circle, rgba(243,129,0,.5) 0%, rgba(243,129,0,.15) 40%, rgba(243,129,0,0) 70%); }
  .p { position:absolute; }
  .fade { position:absolute; left:0; top:1240px; width:1080px; height:680px; background: linear-gradient(180deg, rgba(3,10,31,0), rgba(3,10,31,.85) 35%, #030a1f 50%); }
  .h1 { position:absolute; left:0; top:300px; width:1080px; text-align:center; direction:rtl; }
  .h1 .a { display:inline-block; font-family:Lalezar; color:#fff; font-size:122px; line-height:1.1; -webkit-text-stroke:16px #030a1f; paint-order:stroke fill; text-shadow:0 12px 34px rgba(0,0,0,.5); }
  .h1 .b { display:inline-block; margin-top:10px; font-family:Lalezar; color:#fff; font-size:88px; line-height:1.2; padding:6px 36px 18px; border-radius:24px; background:linear-gradient(90deg,#f38100,#ffa53a); transform:rotate(-2deg); box-shadow:0 16px 40px rgba(243,129,0,.5); }
  .tag { position:absolute; left:50%; transform:translateX(-50%); top:1395px; padding:16px 40px; border-radius:999px; background:rgba(255,255,255,.12); border:2px solid rgba(255,255,255,.35); color:#fff; font-family:Montserrat; font-weight:900; font-size:40px; letter-spacing:6px; white-space:nowrap; }
</style></head>
<body><div id="c">
  <div class="rays"></div><div class="glow"></div>
  <img class="p" src="../assets/src/crew_female_1.png" style="left:-170px;top:700px;width:680px;height:850px">

  <img class="p" src="../assets/img/logo_white.png" style="left:220px;top:1490px;width:640px;height:143px">
