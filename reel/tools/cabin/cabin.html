<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
<script type="module">
/* Airplane cabin interior (narrow-body, 3-3 economy) seen down the aisle from standing eye height.
   Rendered once to a still; tools/make_cabin.py adds lens blur so it reads as a shallow-focus background. */
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RectAreaLightUniformsLib } from 'three/addons/lights/RectAreaLightUniformsLib.js';
RectAreaLightUniformsLib.init();

const q = new URLSearchParams(location.search);
const W = +q.get('w') || 1296, H = +q.get('h') || 2304;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = +q.get('exp') || 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(q.get('fogc') || '#e9e4dc');
scene.fog = new THREE.Fog(q.get('fogc') || '#efe7da', +q.get('fog0') || 7, +q.get('fog1') || 42);

const camera = new THREE.PerspectiveCamera(+q.get('fov') || 58, W / H, 0.05, 120);
camera.position.set(0, +q.get('cy') || 1.5, +q.get('cz') || 0.9);
camera.lookAt(0, +q.get('ly') || 1.3, -12);

const M = (c, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color: c, roughness: 0.6, metalness: 0 }, o));
const mats = {
  seat: M('#1c2c5c', { roughness: 0.55 }),
  seatSide: M('#16234a', { roughness: 0.6 }),
  head: M('#f3f1ea', { roughness: 0.9 }),
  headBand: M('#3a74d8', { roughness: 0.8 }),
  arm: M('#2a2f3a', { roughness: 0.5 }),
  screen: M('#0b1224', { roughness: 0.25, emissive: new THREE.Color('#3f7ee8'), emissiveIntensity: 0.55 }),
  tray: M('#232a3a', { roughness: 0.5 }),
  wall: M('#e8e5df', { roughness: 0.7, side: THREE.DoubleSide }),
  bin: M('#eef0f3', { roughness: 0.4, side: THREE.DoubleSide }),
  ceil: M(q.get('ceilc') || '#f5f3ef', { roughness: 0.8, side: THREE.DoubleSide }),
  psu: M('#d8dbe1', { roughness: 0.5, side: THREE.DoubleSide }),
  carpet: M('#3a4560', { roughness: 1 }),
  runner: M('#2b3552', { roughness: 1 }),
  win: M('#ffffff', { emissive: new THREE.Color(q.get('winc') || '#e4f1ff'), emissiveIntensity: +q.get('wini') || 2.6, roughness: 1 }),
  bezel: M('#f1efea', { roughness: 0.5, side: THREE.DoubleSide }),
  shade: M('#fbfaf7', { roughness: 0.6, emissive: new THREE.Color('#fff4e0'), emissiveIntensity: 0.35, side: THREE.DoubleSide }),
  cove: M('#ffffff', { emissive: new THREE.Color('#ffd9a6'), emissiveIntensity: 3.2 }),
  mood: M('#ffffff', { emissive: new THREE.Color('#8fb6ff'), emissiveIntensity: 1.6 }),
  read: M('#ffffff', { emissive: new THREE.Color('#fff2d8'), emissiveIntensity: 3.5 }),
  sign: M('#ffffff', { emissive: new THREE.Color('#ffffff'), emissiveIntensity: 1.2 }),
  bulk: M('#e6e0d6', { roughness: 0.8 }),
  curtain: M('#22346e', { roughness: 0.9 }),
  exit: M('#ffffff', { emissive: new THREE.Color('#33ff99'), emissiveIntensity: 2.2 }),
  galley: M('#ffffff', { emissive: new THREE.Color('#ffe7c2'), emissiveIntensity: 1.4 }),
};

const Z0 = 3, Z1 = -27, LEN = Z0 - Z1;   // cabin from z = 3 (behind camera) to z = -27 (front bulkhead)

// extrude a 2D (x,y) outline along -z from z0 to z1
function prism(pts, z0, z1, mat, mirror = false) {
  const s = new THREE.Shape(pts.map(([x, y]) => new THREE.Vector2(mirror ? -x : x, y)));
  const g = new THREE.ExtrudeGeometry(s, { depth: z0 - z1, bevelEnabled: false, curveSegments: 12 });
  const m = new THREE.Mesh(g, mat);
  m.position.z = z1;
  scene.add(m);
  return m;
}
function arc(cx, cy, r, a0, a1, n = 10) {
  const out = [];
  for (let i = 0; i <= n; i++) { const a = a0 + (a1 - a0) * i / n; out.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]); }
  return out;
}

// ---------------- shell ----------------
for (const mir of [false, true]) {
  // side wall (thin closed outline: inner curve + outer offset)
  const inner = [[1.66, 0], [1.82, 0.32], [1.90, 0.78], [1.89, 1.22], [1.83, 1.52]];
  const outer = inner.slice().reverse().map(([x, y]) => [x + 0.05, y]);
  prism(inner.concat(outer), Z0, Z1, mats.wall, mir);
  // overhead bins: segments with dark gaps between the doors
  const binPts = [[1.84, 1.52], [0.92, 1.52], ...arc(0.92, 1.64, 0.12, -Math.PI / 2, -Math.PI, 6), [0.80, 1.66], [0.86, 2.0],
    ...arc(0.98, 2.0, 0.12, Math.PI, Math.PI / 2, 6), [1.72, 2.12], [1.84, 1.52]];
  for (let z = Z0; z > Z1; z -= 1.58) prism(binPts, z, Math.max(Z1, z - 1.55), mats.bin, mir);
  // passenger service units under the bins + reading lights
  const psu = new THREE.Mesh(new THREE.PlaneGeometry(0.86, LEN), mats.psu);
  psu.rotation.x = Math.PI / 2; psu.position.set(mir ? -1.36 : 1.36, 1.515, (Z0 + Z1) / 2); scene.add(psu);
  for (let z = 0.2; z > Z1 + 1; z -= 0.8) {
    for (const dx of [-0.16, 0, 0.16]) {
      const r = new THREE.Mesh(new THREE.CircleGeometry(0.022, 12), mats.read);
      r.rotation.x = Math.PI / 2; r.position.set((mir ? -1 : 1) * (1.22 + dx), 1.512, z);
      // only some lights are on
      if (((Math.abs(z * 10) | 0) + (dx * 100 | 0)) % 3 === 0) scene.add(r);
    }
    const sg = new THREE.Mesh(new THREE.PlaneGeometry(0.1, 0.05), mats.sign);
    sg.rotation.x = Math.PI / 2; sg.position.set((mir ? -1 : 1) * 1.02, 1.512, z - 0.3); scene.add(sg);
  }
  // cove light along the top of the bins + soft blue mood strip on the wall
  const cove = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.02, LEN), mats.cove);
  cove.position.set(mir ? -0.97 : 0.97, 2.135, (Z0 + Z1) / 2); scene.add(cove);
  const mood = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.015, LEN), mats.mood);
  mood.position.set(mir ? -1.78 : 1.78, 1.55, (Z0 + Z1) / 2); scene.add(mood);
}
// ceiling arch
const ceilIn = arc(0, 1.2, 1.12, Math.PI * 0.22, Math.PI * 0.78, 48);
prism(ceilIn.concat(ceilIn.slice().reverse().map(([x, y]) => [x * 1.02, y + 0.03])), Z0, Z1, mats.ceil);
// floor + aisle runner
const floor = new THREE.Mesh(new THREE.PlaneGeometry(4, LEN), mats.carpet);
floor.rotation.x = -Math.PI / 2; floor.position.set(0, 0, (Z0 + Z1) / 2); scene.add(floor);
const runner = new THREE.Mesh(new THREE.PlaneGeometry(0.5, LEN), mats.runner);
runner.rotation.x = -Math.PI / 2; runner.position.set(0, 0.002, (Z0 + Z1) / 2); scene.add(runner);

// ---------------- windows ----------------
function rrect(w, h, r) {
  const s = new THREE.Shape();
  s.moveTo(-w / 2 + r, -h / 2); s.lineTo(w / 2 - r, -h / 2); s.quadraticCurveTo(w / 2, -h / 2, w / 2, -h / 2 + r);
  s.lineTo(w / 2, h / 2 - r); s.quadraticCurveTo(w / 2, h / 2, w / 2 - r, h / 2); s.lineTo(-w / 2 + r, h / 2);
  s.quadraticCurveTo(-w / 2, h / 2, -w / 2, h / 2 - r); s.lineTo(-w / 2, -h / 2 + r); s.quadraticCurveTo(-w / 2, -h / 2, -w / 2 + r, -h / 2);
  return new THREE.ShapeGeometry(s, 10);
}
let wi = 0;
for (let z = 2.2; z > Z1 + 1; z -= 0.53, wi++) {
  for (const side of [1, -1]) {
    const grp = new THREE.Group();
    const bez = new THREE.Mesh(rrect(0.34, 0.46, 0.13), mats.bezel);
    const win = new THREE.Mesh(rrect(0.23, 0.33, 0.1), mats.win); win.position.z = 0.004;
    grp.add(bez, win);
    const shadeDown = (wi * 7 + (side > 0 ? 3 : 0)) % 5;   // a few shades half down
    if (shadeDown === 1 || shadeDown === 4) {
      const sh = new THREE.Mesh(new THREE.PlaneGeometry(0.235, shadeDown === 1 ? 0.17 : 0.24), mats.shade);
      sh.position.set(0, shadeDown === 1 ? 0.08 : 0.045, 0.008); grp.add(sh);
    }
    grp.position.set(side * 1.875, 1.06, z);
    grp.rotation.y = -side * Math.PI / 2;
    grp.rotation.x = 0;
    grp.rotateX(side * 0.0);
    scene.add(grp);
  }
}

// ---------------- seats ----------------
const backG = new RoundedBoxGeometry(0.44, 0.74, 0.11, 4, 0.04);
const headG = new RoundedBoxGeometry(0.41, 0.24, 0.135, 4, 0.05);
const bandG = new RoundedBoxGeometry(0.415, 0.035, 0.138, 2, 0.012);
const cushG = new RoundedBoxGeometry(0.44, 0.13, 0.47, 4, 0.05);
const armG = new RoundedBoxGeometry(0.05, 0.05, 0.42, 2, 0.02);
const scrG = new THREE.PlaneGeometry(0.21, 0.13);
const trayG = new THREE.PlaneGeometry(0.36, 0.2);
// passengers: the tops of heads peeking over some seat backs
const hairMats = ['#1d1510', '#2b1d14', '#3a2a1e', '#15100c', '#4a3626', '#0f0d0c'].map((c) => M(c, { roughness: 0.75 }));
const headSph = new THREE.SphereGeometry(0.105, 20, 14);
let pseed = 7;
const prand = () => (pseed = (pseed * 16807) % 2147483647) / 2147483647;
function passenger(x, z) {
  const h = new THREE.Mesh(headSph, hairMats[(prand() * hairMats.length) | 0]);
  h.scale.set(1, 1.15, 1.1);
  h.position.set(x + (prand() - 0.5) * 0.06, 1.2 + prand() * 0.06, z - 0.16);
  scene.add(h);
}
function seat(x, z) {
  if (+q.get('pax') && prand() < +q.get('pax')) passenger(x, z);
  const g = new THREE.Group();
  const back = new THREE.Mesh(backG, mats.seat); back.position.set(0, 0.79, 0); g.add(back);
  const head = new THREE.Mesh(headG, mats.head); head.position.set(0, 1.1, 0.005); g.add(head);
  const band = new THREE.Mesh(bandG, mats.headBand); band.position.set(0, 1.02, 0.006); g.add(band);
  const scr = new THREE.Mesh(scrG, mats.screen); scr.position.set(0, 0.9, 0.058); g.add(scr);
  const tray = new THREE.Mesh(trayG, mats.tray); tray.position.set(0, 0.66, 0.057); g.add(tray);
  g.rotation.x = 0.13;
  g.position.set(x, 0, z);
  const cush = new THREE.Mesh(cushG, mats.seatSide); cush.position.set(x, 0.45, z - 0.27); scene.add(cush);
  scene.add(g);
}
for (let r = 0; r < 34; r++) {
  const z = 0.5 - r * 0.8;
  if (z < Z1 + 1.2) break;
  for (const side of [1, -1]) {
    for (let k = 0; k < 3; k++) seat(side * (0.5 + k * 0.46), z);
    for (let k = 0; k < 4; k++) {
      const a = new THREE.Mesh(armG, mats.arm); a.position.set(side * (0.27 + k * 0.46), 0.64, z - 0.24); scene.add(a);
    }
  }
}

// ---------------- front bulkhead / galley ----------------
const bulk = new THREE.Mesh(new THREE.PlaneGeometry(4, 2.4), mats.bulk); bulk.position.set(0, 1.2, Z1 + 0.01); scene.add(bulk);
const cur = new THREE.Mesh(new THREE.PlaneGeometry(0.9, 1.95), mats.curtain); cur.position.set(0, 0.98, Z1 + 0.03); scene.add(cur);
const gal = new THREE.Mesh(new THREE.PlaneGeometry(0.9, 0.12), mats.galley); gal.position.set(0, 2.0, Z1 + 0.03); scene.add(gal);
const ex = new THREE.Mesh(new THREE.PlaneGeometry(0.3, 0.1), mats.exit); ex.position.set(0, 2.06, Z1 + 0.04); scene.add(ex);

// ---------------- lights ----------------
scene.add(new THREE.HemisphereLight(q.get('hemic') || '#fff3e2', '#3b4152', +q.get('hemi') || 1.7));
for (let z = 1.5; z > Z1; z -= 2.6) {
  const p = new THREE.PointLight('#ffe8c8', +q.get('pl') || 5.5, 7, 2);
  p.position.set(0, +q.get('ply') || 2.05, z); scene.add(p);
}
for (let z = 0.9; z > Z1; z -= 1.6) {         // warm reading-light pools on the seats
  for (const side of [1, -1]) {
    const sp = new THREE.SpotLight('#ffe2b0', +q.get('spot') || 0.001, 3.2, 0.75, 0.8, 2);
    sp.position.set(side * 1.0, 1.5, z); sp.target.position.set(side * 0.95, 0.6, z - 0.2);
    scene.add(sp, sp.target);
  }
}
const sun = new THREE.DirectionalLight('#fff0d4', +q.get('sun') || 1.2);
sun.position.set(-6, 4, -1); sun.target.position.set(0, 1, -6); scene.add(sun, sun.target);

for (const side of [1, -1]) {
  const ra = new THREE.RectAreaLight(q.get('moodc') || '#a9c4ff', +q.get('mood') || 6, +q.get('moodw') || 0.08, LEN);
  ra.position.set(side * 0.97, 2.13, (Z0 + Z1) / 2);
  ra.rotation.x = Math.PI / 2;    // emit upward onto the ceiling
  ra.rotateY(0); scene.add(ra);
  const rb = new THREE.RectAreaLight('#ffe2bd', +q.get('psuL') || 3, 0.5, LEN);
  rb.position.set(side * 1.3, 1.50, (Z0 + Z1) / 2);
  rb.rotation.x = -Math.PI / 2;   // under-bin wash down onto the seats
  scene.add(rb);
}
renderer.render(scene, camera);
window.DONE = true;
</script>
</body></html>
